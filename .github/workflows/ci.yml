name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: build/package-lock.json
      - name: Install build dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: build
      - name: Build the skill
        run: node build.mjs
        working-directory: build
      - name: Validate the example diagrams
        run: npm run check
      - name: Unit, CLI and HTML tests
        run: npm test
      - name: Render the reference offline
        run: npm run standalone
