name: Release

# Push a tag `vX.Y.Z` matching package.json "version": the workflow builds the
# plugin and attaches the installable tarball to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: build/package-lock.json
      - name: Tag must match package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Install build dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: build
      - name: Build client and engine
        run: node build.mjs
        working-directory: build
      - name: Validate and test
        run: npm run check && npm test
      - name: Pack
        run: npm pack
      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/dsh-diagram-$version.tgz"
          printf '\n## Install\n\n```sh\ndsh plugin --profile web add %s\n```\n\nThen refresh the page. Requires DSH %s.\n' "$url" "$(node -p "require('./package.json').engines.dsh")" >> notes.md
          cat notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dsh-diagram-*.tgz --title "dsh-diagram $GITHUB_REF_NAME" --notes-file notes.md
